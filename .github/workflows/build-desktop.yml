# Builds installers for Windows, macOS and Linux.
# Run it by hand from the Actions tab, or push a tag like v0.1.0.
# (Type-checking and tests on every push are in check.yml.)
name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  # The handwriting library's Node runtime tries to download GPU binaries on Linux and fails when
  # they are not published. The app only runs that library in the browser. (.npmrc says the same
  # for local installs; this does not depend on npm passing unknown settings through.)
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Code signing is optional. With none of these repository secrets set the
      # installers are built unsigned; set them and the same workflow signs
      # (and, on macOS, notarises) the builds. See "Signing the installers" in
      # the README for what each one is. Only the ones that are set are passed
      # on: an empty CSC_LINK is read as the path of a certificate file, and the
      # macOS build fails looking for it.
      - name: Pass on the signing settings that are configured
        shell: bash
        env:
          IN_CSC_LINK: ${{ secrets.CSC_LINK }}
          IN_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          IN_WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          IN_WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          IN_APPLE_ID: ${{ secrets.APPLE_ID }}
          IN_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          IN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          count=0
          for name in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            input="IN_$name"
            if [ -n "${!input}" ]; then
              { echo "$name<<__END_OF_VALUE__"; echo "${!input}"; echo "__END_OF_VALUE__"; } >> "$GITHUB_ENV"
              count=$((count + 1))
            fi
          done
          echo "$count signing settings configured"
      - run: npm run dist -- --publish never
        env:
          # Never pick up a certificate that merely happens to be in the runner's keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v6
        with:
          name: math-physics-workbench-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
